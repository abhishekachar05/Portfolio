<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .duck, .helmet {
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
      fill: none;
    }
    /* Giao diện sáng */
    @media (prefers-color-scheme: light) {
      .duck { stroke: #1a1a1a; }
      .helmet { stroke: #4a4a4a; }
    }
    /* Giao diện tối (mặc định) */
    @media (prefers-color-scheme: dark) {
      .duck { stroke: #f0f0f0; }
      .helmet { stroke: #a0a0a0; }
    }
  </style>
  <!-- Mũ phi hành gia -->
  <circle class="helmet" cx="16" cy="16" r="12"/>
  <!-- Đầu vịt -->
  <path class="duck" d="M15,13 A4,4 0 0,1 23,13 A6,6 0 0,1 23,21 L13,21 A6,6 0 0,1 13,13 Z"/>
  <!-- Mỏ vịt -->
  <path class="duck" d="M23,17 C25,17 27,18 26,20 C25,22 23,21 23,21"/>
  <!-- Mắt -->
  <circle class="duck" cx="19" cy="16" r="1" fill="currentColor"/>
</svg>
